<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e2f2eb">
  <title>Madushan's Rating List</title>
  <meta name="description" content="Computer chess engine ratings at Blitz (2+1) and Classical (12+8) on a CCRL-equivalent scale, with error bars, LOS and full statistics.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem('mrl-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 45 45" aria-hidden="true"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="currentColor"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.99 2.5-3c1 0 1 3 1 3" fill="currentColor"/></svg>
        <span>
          <span class="brand-title" id="site-title">Madushan's Rating List</span>
          <span class="brand-sub" id="site-sub">Computer chess engine ratings</span>
        </span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Rating lists"></nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="app">
    <div class="loading">Loading ratings…</div>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <div id="tip" role="tooltip" hidden></div>
  <script src="assets/app.js"></script>
</body>
</html>
