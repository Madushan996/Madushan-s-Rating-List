name: Rate & publish

# Recomputes every rating list from the PGN files and deploys the website to
# GitHub Pages. Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy (optional speed-up for large pools)
        run: pip install numpy

      - name: Compute ratings
        run: python tools/rate.py

      - name: Publish PGN downloads alongside the site
        run: |
          mkdir -p site/pgn
          cp -r pgn/* site/pgn/ 2>/dev/null || true
          find site/pgn -name .gitkeep -delete

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
